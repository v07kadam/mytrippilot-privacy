<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTripPilot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 32px;
      max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { color: #2c3e50; font-size: 22px; margin-bottom: 10px; }
    p { color: #6b7280; line-height: 1.6; font-size: 15px; margin-bottom: 8px; }
    input {
      width: 100%; padding: 13px 16px; border: 1.5px solid #ddd;
      border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none;
      color: #2c3e50;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 14px; background: #3b82f6; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #93c5fd; cursor: default; }
    .badge {
      display: inline-block; margin-top: 20px;
      background: #d1fae5; color: #065f46;
      padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600;
    }
    .error { color: #dc2626; font-size: 13px; margin-top: 8px; margin-bottom: 0; }
    .back { display: block; margin-top: 24px; color: #2563eb; font-size: 14px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    #resetForm { margin-top: 20px; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Please wait...</h1>
    <p id="body"></p>
    <div id="resetForm" style="display:none">
      <input type="password" id="pw1" placeholder="New password (min 6 characters)" />
      <input type="password" id="pw2" placeholder="Confirm new password" />
      <p class="error" id="pwError" style="display:none"></p>
      <button id="setBtn" onclick="setPassword()">Set New Password</button>
    </div>
    <div id="badge" style="display:none"></div>
    <a href="index.html" class="back">← Back to Privacy Policy</a>
  </div>

  <script>
    const supabase = window.supabase.createClient('https://njcgsrwezavsxmgfufzb.supabase.co', 'sb_publishable_ZIMUaDFYEppDSPSyFeAeXA_5g8NTb4f');

    const params = new URLSearchParams(window.location.hash.replace('#', '?'));
    const type  = params.get('type');
    const err   = params.get('error_description');
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    const icon  = document.getElementById('icon');
    const title = document.getElementById('title');
    const body  = document.getElementById('body');
    const badge = document.getElementById('badge');

    async function init() {
      if (err) {
        icon.textContent  = '❌';
        title.textContent = 'Link expired or invalid';
        body.textContent  = decodeURIComponent(err);
        badge.className   = 'badge';
        badge.style.background = '#fee2e2';
        badge.style.color = '#991b1b';
        badge.textContent = 'Please request a new link';
        badge.style.display = 'inline-block';
        return;
      }

      if (type === 'recovery' && accessToken) {
        // Set the session from the recovery token so updateUser works
        await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        icon.textContent  = '🔑';
        title.textContent = 'Set your new password';
        body.textContent  = 'Enter and confirm a new password below.';
        document.getElementById('resetForm').style.display = 'block';
        return;
      }

      // Signup confirmation or other
      icon.textContent  = '✅';
      title.textContent = 'Email confirmed!';
      body.textContent  = 'Your MyTripPilot account is now active. Open the app to sign in.';
      badge.className   = 'badge';
      badge.textContent = '✓ Account activated';
      badge.style.display = 'inline-block';
    }

    async function setPassword() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const pwErr = document.getElementById('pwError');
      const btn = document.getElementById('setBtn');

      pwErr.style.display = 'none';

      if (pw1.length < 6) {
        pwErr.textContent = 'Password must be at least 6 characters.';
        pwErr.style.display = 'block';
        return;
      }
      if (pw1 !== pw2) {
        pwErr.textContent = 'Passwords do not match.';
        pwErr.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      const { error } = await supabase.auth.updateUser({ password: pw1 });

      if (error) {
        pwErr.textContent = error.message;
        pwErr.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Set New Password';
        return;
      }

      document.getElementById('resetForm').style.display = 'none';
      icon.textContent  = '✅';
      title.textContent = 'Password updated!';
      body.textContent  = 'Your password has been changed. Open the MyTripPilot app and sign in with your new password.';
      badge.className   = 'badge';
      badge.textContent = '✓ Done';
      badge.style.display = 'inline-block';
    }

    init();
  </script>
</body>
</html>
